<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS-ULTIMATE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 20px; background: #16213e; text-align: center; border-bottom: 2px solid #0f3460; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; }
        .message { margin: 10px 0; padding: 12px 16px; border-radius: 12px; max-width: 80%; }
        .message.user { margin-left: auto; background: #0f3460; text-align: right; }
        .message.assistant { margin-right: auto; background: #2a2a4a; }
        .input-container { padding: 20px; display: flex; gap: 10px; background: #16213e; border-top: 2px solid #0f3460; }
        .input-container input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #2a2a4a; color: #eee; font-size: 16px; outline: none; }
        .input-container button { padding: 12px 24px; border: none; border-radius: 8px; background: #0f3460; color: #fff; font-weight: bold; cursor: pointer; }
        .input-container button:hover { background: #1a4a8a; }
        .login-box { max-width: 300px; margin: 100px auto; background: #16213e; padding: 30px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        .login-box input { padding: 10px; border: none; border-radius: 6px; }
        .login-box button { padding: 10px; background: #0f3460; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .settings-box { max-width: 400px; margin: 100px auto; background: #16213e; padding: 30px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        .settings-box input { padding: 10px; border: none; border-radius: 6px; }
        .settings-box button { padding: 10px; background: #0f3460; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app">
        <div id="loginView" style="display:none;">
            <div class="login-box">
                <h2>تسجيل الدخول</h2>
                <input id="usernameInput" placeholder="اسم المستخدم">
                <input id="passwordInput" type="password" placeholder="كلمة المرور">
                <input id="apiUrlLogin" placeholder="رابط الخادم (API URL)" value="https://your-server.onrender.com">
                <button id="loginBtn">دخول</button>
                <div id="loginError" style="color:red;"></div>
            </div>
        </div>
        <div id="chatView" style="display:flex; flex-direction:column; height:100vh;">
            <header>
                <h1>🤖 NEXUS-ULTIMATE Desktop</h1>
                <button id="settingsBtn" style="padding:5px 15px;">⚙️</button>
                <button id="logoutBtn" style="padding:5px 15px;">تسجيل خروج</button>
            </header>
            <div class="chat-container" id="chatContainer">
                <div class="message assistant">مرحباً! أنا NEXUS-ULTIMATE، اسألني أي شيء.</div>
            </div>
            <div class="input-container">
                <input type="text" id="userInput" placeholder="اكتب سؤالك...">
                <button id="sendButton">إرسال</button>
            </div>
        </div>
        <div id="settingsView" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center;">
            <div class="settings-box">
                <h2>الإعدادات</h2>
                <label>رابط الخادم (API URL):</label>
                <input id="apiUrlInput" type="text" value="https://your-server.onrender.com">
                <button id="saveSettingsBtn">حفظ</button>
                <button id="closeSettingsBtn">إغلاق</button>
            </div>
        </div>
    </div>
    <script>
        let token = '';
        let userId = '';
        let apiUrl = 'https://your-server.onrender.com';

        const loginView = document.getElementById('loginView');
        const chatView = document.getElementById('chatView');
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = content;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function loadSettings() {
            const settings = await window.api.loadSettings();
            if (settings.apiUrl) {
                apiUrl = settings.apiUrl;
                document.getElementById('apiUrlLogin').value = apiUrl;
                document.getElementById('apiUrlInput').value = apiUrl;
            }
        }

        async function login() {
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            const url = document.getElementById('apiUrlLogin').value;
            apiUrl = url;
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = '';
            try {
                const result = await window.api.login(username, password, apiUrl);
                if (result.success) {
                    token = result.token;
                    userId = result.user_id;
                    await window.api.saveSettings({ apiUrl });
                    loginView.style.display = 'none';
                    chatView.style.display = 'flex';
                } else {
                    errorDiv.textContent = result.error || 'فشل تسجيل الدخول';
                }
            } catch (e) {
                errorDiv.textContent = e.message;
            }
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query) return;
            userInput.value = '';
            addMessage('user', query);

            try {
                const result = await window.api.ask(query, token, apiUrl);
                if (result.success) {
                    addMessage('assistant', result.response);
                } else {
                    addMessage('assistant', `⚠️ ${result.error}`);
                }
            } catch (error) {
                addMessage('assistant', `⚠️ ${error.message}`);
            }
        }

        function logout() {
            token = '';
            userId = '';
            loginView.style.display = 'block';
            chatView.style.display = 'none';
            chatContainer.innerHTML = '';
        }

        document.getElementById('loginBtn').addEventListener('click', login);
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => e.key === 'Enter' && sendMessage());
        document.getElementById('logoutBtn').addEventListener('click', logout);

        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('settingsView').style.display = 'flex';
        });

        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsView').style.display = 'none';
        });

        document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
            const newApiUrl = document.getElementById('apiUrlInput').value;
            apiUrl = newApiUrl;
            await window.api.saveSettings({ apiUrl: newApiUrl });
            document.getElementById('apiUrlLogin').value = newApiUrl;
            alert('✅ تم حفظ الإعدادات');
            document.getElementById('settingsView').style.display = 'none';
        });

        window.addEventListener('load', async () => {
            await loadSettings();
            loginView.style.display = 'block';
            chatView.style.display = 'none';
        });
    </script>
</body>
</html>
