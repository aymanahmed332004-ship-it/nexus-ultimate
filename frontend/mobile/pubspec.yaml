name: nexus_app
version: 1.0.0
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  speech_to_text: ^6.6.0
  audioplayers: ^5.2.1

  # مكتبات التصميم والملفات
  google_fonts: ^6.1.0
  image_picker: ^1.0.4
  file_picker: ^6.1.1

  # مكتبة الإعلانات الرسمية من جوجل (AdMob)
  google_mobile_ads: ^5.0.0

  # ===== مكتبات Firebase (جديدة) =====
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.0
  # =================================

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true