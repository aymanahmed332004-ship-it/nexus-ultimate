services:
  - type: web
    name: nexus-ultimate
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: ASSEMBLYAI_KEY
        sync: false
      - key: CLOUDFLARE_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: redis
          property: connectionString
  - type: redis
    name: nexus-redis
    maxmemoryPolicy: noeviction